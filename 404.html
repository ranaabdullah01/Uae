<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <!-- GitHub Pages doesn't support real server-side routing for single-page apps.
         When someone refreshes /blog/my-post or opens it directly, GitHub Pages serves
         this 404.html. This script re-encodes the real path into a query string and
         redirects to index.html, where the script in index.html's <head> decodes it
         back into a clean URL via history.replaceState.

         pathSegmentsToKeep is auto-detected:
           - 1 on *.github.io project pages (keeps the "/Uae" folder in the URL)
           - 0 once you connect a custom domain (root-level, no folder to keep)
         No manual change needed when you switch to a custom domain later.
         See: https://github.com/rafgraph/spa-github-pages -->
    <script type="text/javascript">
        var pathSegmentsToKeep = (location.hostname.match(/\.github\.io$/) ? 1 : 0);
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>
<body>
</body>
</html>
